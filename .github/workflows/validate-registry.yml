name: validate-registry
on: [push, pull_request]
jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: claim status probe
        run: python probes/claim_status_probe.py
      - name: ledger continuity probe
        run: python probes/ledger_continuity_probe.py
