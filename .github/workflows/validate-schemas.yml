name: validate-schemas
on: [push, pull_request]
jobs:
  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JSON cases parse
        run: |
          python -c "import json,glob; [json.load(open(p)) for p in glob.glob('benchmarks/cases/*.json')+glob.glob('benchmarks/schemas/*.json')+glob.glob('outcomes/artifacts/*.json')+glob.glob('registry/*.json')]; print('ok')"
