name: protect-open-status
on: [push, pull_request]
jobs:
  open:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Protect RH and Coleman OPEN seals
        run: python probes/open_status_probe.py
